<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">PYXYZC terminal profile banner</title>
  <desc id="desc">A neon terminal interface introducing Pengyao, focused on AI infrastructure, GPU compute, and terminal craft.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117" />
      <stop offset="1" stop-color="#090d12" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c" />
      <stop offset="0.55" stop-color="#00e5ff" />
      <stop offset="1" stop-color="#a371f7" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#2ea043" stroke-width="0.5" opacity="0.13" />
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.018" />
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="screen">
      <rect x="20" y="18" width="860" height="244" rx="12" />
    </clipPath>
  </defs>

  <rect width="900" height="280" fill="#010409" />
  <rect x="20" y="18" width="860" height="244" rx="12" fill="url(#panel)" stroke="#30363d" stroke-width="2" />

  <g clip-path="url(#screen)">
    <rect x="20" y="18" width="860" height="244" fill="url(#grid)" />
    <rect x="20" y="18" width="860" height="244" fill="url(#scanlines)" />
    <path d="M20 57 H880" stroke="#30363d" />
    <rect x="20" y="18" width="860" height="3" fill="url(#accent)" opacity="0.85" />

    <circle cx="43" cy="38" r="5" fill="#ff5f56" />
    <circle cx="61" cy="38" r="5" fill="#ffbd2e" />
    <circle cx="79" cy="38" r="5" fill="#27c93f" />
    <text x="110" y="43" fill="#8b949e" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12">~/identity — tty — 90×24</text>
    <text x="843" y="43" fill="#3fb950" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11">● LIVE</text>

    <text x="52" y="91" fill="#8b949e" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14">
      <tspan fill="#00ff9c">pyxyzc@github</tspan><tspan fill="#c9d1d9">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#c9d1d9">$ ./identify --verbose</tspan>
    </text>

    <text x="50" y="146" fill="#f0f6fc" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="43" font-weight="700" letter-spacing="5">PENGYAO</text>
    <rect x="51" y="160" width="438" height="2" fill="url(#accent)" filter="url(#glow)" />
    <text x="52" y="188" fill="#00ff9c" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="1.2">AI INFRA  /  GPU COMPUTE  /  TERMINAL CRAFT</text>

    <text x="52" y="225" fill="#8b949e" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12">signal:// model → runtime → memory → silicon</text>
    <rect x="379" y="214" width="8" height="14" fill="#00ff9c">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
    </rect>

    <g transform="translate(565 78)">
      <rect width="268" height="150" rx="7" fill="#0d1117" fill-opacity="0.88" stroke="#238636" />
      <text x="17" y="26" fill="#3fb950" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11">SYS://PYXYZC</text>
      <text x="17" y="51" fill="#8b949e" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11">FOCUS</text>
      <text x="83" y="51" fill="#c9d1d9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11">LLM_SERVING</text>
      <text x="17" y="72" fill="#8b949e" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11">CACHE</text>
      <text x="83" y="72" fill="#c9d1d9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11">WARM</text>
      <text x="17" y="93" fill="#8b949e" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11">EDITOR</text>
      <text x="83" y="93" fill="#c9d1d9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11">NVIM + TMUX</text>
      <text x="17" y="114" fill="#8b949e" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11">UPTIME</text>
      <text x="83" y="114" fill="#00e5ff" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11">LEARNING</text>
      <rect x="17" y="130" width="232" height="4" rx="2" fill="#21262d" />
      <rect x="17" y="130" width="178" height="4" rx="2" fill="url(#accent)">
        <animate attributeName="width" values="85;220;178" dur="5s" repeatCount="indefinite" />
      </rect>
    </g>

    <circle cx="855" cy="242" r="2.5" fill="#00ff9c" filter="url(#glow)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
