name: Generate profile assets

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/profile-assets.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Prepare output directory
        run: mkdir -p dist

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&rank_icon=github&show=reviews,prs_merged&bg_color=0D1117&title_color=00FF9C&text_color=C9D1D9&icon_color=00E5FF&border_color=30363D
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate language stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}&layout=compact&langs_count=8&bg_color=0D1117&title_color=00FF9C&text_color=C9D1D9&icon_color=00E5FF&border_color=30363D
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-snake.svg?color_snake=#00B874&color_dots=#EBEDF0,#9BE9A8,#40C463,#30A14E,#216E39
            dist/contribution-snake-dark.svg?palette=github-dark&color_snake=#00FF9C&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353

      - name: Publish generated assets
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: "chore: refresh profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
